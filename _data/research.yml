- title: "Effect of Fuel Type and Temperature on Shock-Induced Richtmyer-Meshkov Mixing of a Strut-Injected Fuel Layer in a Scramjet Combustor"
  role: "Undergraduate Thesis Researcher"
  advisor: "Prof. Dr. Fazlar Rahman"
  institution: "Ahsanullah University of Science and Technology (AUST)"
  period: "Ongoing (Expected Graduation: 2027)"
  image: "/assets/img/RMI_STRUT-ezgif.com-video-to-gif-converter.mp4"
  tools: ["OpenFOAM", "ANSYS Fluent"]
  summary: "Investigating shock-wave/fuel-jet interactions and baroclinic vorticity generation driving Richtmyer-Meshkov instability (RMI) in supersonic scramjet combustors. Evaluating how fuel species properties and injection temperatures govern molecular mixing efficiency and flameholding potential."
  highlights:
    - "Formulating high-resolution compressible CFD simulations to capture shock-induced shear layer roll-up and turbulent fuel-air mixing downstream of a strut injector."
    - "Quantifying spatial mixing efficiency, total pressure recovery, and vorticity deposition across varied fuel types and inlet stagnation temperatures."

