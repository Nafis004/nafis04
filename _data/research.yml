  summary: "District cooling (DC) is defined as a system that generates and distributes cold energy to meet the cooling needs of connected buildings, primarily using chilled water circulated through a network of pipes. It offers advantages over traditional air conditioning by providing better efficiency and a longer life cycle through a central chiller plant."
